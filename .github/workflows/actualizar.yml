name: Publicar en GitHub Pages

# Este observatorio NO se regenera en CI: son 2.154 ficheros de votación del Congreso, unos
# 140 s de descarga más el agregado. Se regenera en local con `scripts/congreso_fetch.py` y
# `scripts/congreso_build.py`, y se sube el resultado. Aquí solo se publica `site/`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
